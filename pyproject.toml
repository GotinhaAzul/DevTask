[project]
name = "devtask"
version = "0.1.0"
description = "Personal Project for studies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastapi-pagination>=0.15.16",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "uvicorn>=0.52.1",
]

[tool.setuptools.packages.find]
include = ["mycode*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
